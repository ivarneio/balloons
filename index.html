<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Õhupallid</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Õhupallid">
  <meta property="og:description" content="Peole loom, näokuju, säde või kink.">
  <meta property="og:url" content="https://ivarneio.github.io/balloons/">
  <meta property="og:image" content="https://ivarneio.github.io/balloons/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f8eef6;
      --paper: #fff7fb;
      --ink: #2a1024;
      --muted: #7a4e72;
      --line: #efcfe3;
      --accent: #e01b8c;
      --hot: #c4009a;
      --dark: #2a0a28;
      --mist: #fdeef8;
    }
    * { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }
    body {
      margin: 0;
      font-family: "Source Sans 3", system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.6;
    }
    .riba {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--dark);
      display: block;
      justify-content: space-between;
      align-items: center;
      padding: .55rem 1.15rem;
      gap: 1rem;
    }
    .hero {
      position: relative;
      min-height: 88vh;
      background: var(--dark) center/cover no-repeat;
      background-image: linear-gradient(180deg, rgba(42,8,40,.16) 0%, rgba(42,8,40,.20) 45%, rgba(42,8,40,.78) 100%), url("hero.jpg");
      color: #fdeef8;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .hero-inner {
      width: min(42rem, calc(100% - 2.2rem));
      margin: 0 auto;
    }
    .hero-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .logo {
      display: block;
      width: 3.1rem;
      height: 3.1rem;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid rgba(253,238,248,.5);
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
      flex-shrink: 0;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-right {
      display: flex;
      align-items: center;
      gap: .85rem;
    }
    .social { display: flex; gap: .65rem; }
    .social a {
      width: 2.75rem; height: 2.75rem;
      border-radius: 999px;
      display: grid; place-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
    }
    .social a.fb { background: #1877F2; }
    .social a.ig {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    }
    .social svg { width: 1.2rem; height: 1.2rem; fill: #fff; }
    .langs { display: flex; gap: .28rem; font-size: .78rem; letter-spacing: .1em; }
    .langs button {
      background: none; border: 0; color: #fdeef8; opacity: .55;
      cursor: pointer; font: inherit; letter-spacing: .12em;
    }
    .langs button.on { opacity: 1; }
    .hero-inner { padding-bottom: 2.6rem; }
    .eyebrow {
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .78;
      margin: 0 0 .7rem;
    }
    .hero-nimi {
      display: inline-block;
      text-align: center;
    }
    .hero h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(3.1rem, 8vw + 1.2rem, 5.8rem);
      font-weight: 500;
      line-height: 1.05;
      margin: 0 0 .55rem;
    }
    .hero .lead { margin: 0 0 1.3rem; font-size: 1.05rem; max-width: none; opacity: .92; }
    nav.toc {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem .85rem;
      font-size: .84rem;
      flex: 1;
      justify-content: center;
    }
    nav.toc a { color: #fdeef8; text-decoration: none; border-bottom: 1px solid rgba(253,238,248,.38); padding-bottom: 1px; }
    .menu-nupp {
      display: none;
      background: none;
      border: 0;
      color: #fdeef8;
      font-size: 1.45rem;
      line-height: 1;
      cursor: pointer;
      padding: .2rem .35rem;
    }
    details.acc, #kontakt {
      scroll-margin-top: 5.4rem;
    }
    @media (max-width: 820px) {
      .hero {
        background-image: linear-gradient(180deg, rgba(42,8,40,.16) 0%, rgba(42,8,40,.26) 40%, rgba(42,8,40,.82) 100%), url("hero-mobiil.jpg");
      }
      .menu-nupp { display: block; }
      nav.toc {
        display: none;
        position: absolute;
        left: 0; right: 0;
        top: 100%;
        background: var(--dark);
        flex-direction: column;
        gap: 0;
        padding: .4rem 1.15rem .8rem;
        justify-content: flex-start;
      }
      .riba.lahti nav.toc { display: flex; }
      nav.toc a {
        border-bottom: 1px solid rgba(253,238,248,.18);
        padding: .55rem 0;
      }
      #mis, #kuidas, #muud, #pildid, #kontakt {
        scroll-margin-top: 5.4rem;
      }
    }
    .wrap {
      width: min(40rem, calc(100% - 2.4rem));
      margin: 0 auto;
      padding: 2.4rem 0 8rem;
      font-size: 1rem;
    }
    h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.55rem;
      font-weight: 500;
      margin: 2.1rem 0 .8rem;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.25rem 1.3rem 1.15rem;
      box-shadow: 0 10px 30px rgba(43, 28, 22, .05);
    }
    .card .when {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.55rem;
      line-height: 1.2;
    }
    .card .where { color: var(--muted); margin-top: .15rem; }
    .list { list-style: none; padding: 0; margin: 0; }
    .list li { padding: .85rem 0; border-bottom: 1px solid var(--line); }
    .list li:last-child { border-bottom: 0; }
    .tais {
      display: inline-block;
      margin-left: .35rem;
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    #teenused.flipib details.acc .acc-clip { transition: none; }
    details.acc.avatud {
      border-color: #e59abc;
      border-width: 1.5px;
      background: #fff;
      box-shadow: 0 6px 20px rgba(42, 16, 36, .06);
    }
    details.acc:not(.avatud) { opacity: .88; }
    details.acc {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin: .55rem 0;
      overflow: hidden;
    }
    details.acc summary {
      cursor: pointer;
      padding: .95rem 1.15rem;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.28rem;
      gap: 1rem;
    }
    .sum-peamine {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: .2rem;
      text-align: left;
    }
    .sum-silt { line-height: 1.2; }
    #jargmine {
      font-family: "Source Sans 3", sans-serif;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 400;
    }
    #jargmine .when {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.35rem;
      color: var(--ink);
      display: block;
    }
    #jargmine .where { display: block; }
    details.acc summary::-webkit-details-marker { display: none; }
    details.acc summary::after {
      content: "";
      width: .55rem; height: .55rem;
      border-right: 1.5px solid var(--accent);
      border-bottom: 1.5px solid var(--accent);
      transform: rotate(45deg);
    }
    details.acc[open] summary::after { transform: rotate(225deg); }
    details.acc .acc-clip {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .85s ease-in-out;
    }
    details.acc.avatud .acc-clip {
      grid-template-rows: 1fr;
    }
    details.acc .acc-clip > .body {
      overflow: hidden;
      min-height: 0;
    }
    details.acc .body {
      padding: 0 1.15rem 1.15rem;
      color: var(--muted);
    }
    details.inner { border-top: 1px solid var(--line); margin-top: .7rem; padding-top: .2rem; }
    details.inner summary {
      font-family: "Source Sans 3", sans-serif;
      font-size: .95rem;
      padding: .55rem 0;
      cursor: pointer;
    }
    .galeriid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .7rem;
    }
    @media (max-width: 820px) {
      .galeriid { grid-template-columns: 1fr; }
    }
    .galerii-kaart {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      padding: 0;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
    }
    .galerii-kaart img {
      width: 100%;
      height: 10.5rem;
      object-fit: cover;
      display: block;
      background: var(--line);
    }
    .galerii-kaart span {
      display: block;
      padding: .7rem .85rem .8rem;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.22rem;
    }
    .acc .galerii-kaart {
      width: 100%;
      margin-top: .9rem;
    }
    .acc .galerii-kaart img { height: 12rem; }
    .acc .galerii-kaart span { display: none; }
    .vaade {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      height: 100%;
      height: 100dvh;
      z-index: 80;
      background: rgba(14, 9, 6, .94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: .6rem .6rem 0;
      padding-top: max(.6rem, env(safe-area-inset-top, 0px));
      padding-bottom: max(.6rem, env(safe-area-inset-bottom, 0px));
    }
    .vaade.sees { display: flex; }
    .vaade-suur {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: grid;
      place-items: center;
    }
    .vaade-suur img {
      max-width: 100%;
      max-height: calc(100vh - 7.2rem);
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .vaade-suur img.nahtav { opacity: 1; }
    .vaade-sulge {
      position: fixed;
      top: max(.55rem, env(safe-area-inset-top, 0px));
      right: max(.55rem, env(safe-area-inset-right, 0px));
      z-index: 90;
      background: rgba(26,17,13,.72);
      border: 1px solid rgba(253,238,248,.38);
      color: #fdeef8;
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      min-width: 2.7rem;
      min-height: 2.7rem;
      border-radius: 999px;
      padding: .35rem .7rem;
    }
    .vaade-sulge .sona { display: none; margin-left: .25rem; font-size: .92rem; }
    @media (max-width: 820px) {
      .vaade-sulge {
        top: auto;
        right: 50%;
        left: auto;
        bottom: max(.85rem, env(safe-area-inset-bottom, 0px));
        transform: translateX(50%);
        min-width: 7.2rem;
        background: #2a1024;
        border-color: #f472d0;
        font-size: 1.35rem;
      }
      .vaade-sulge .sona { display: inline; }
      .vaade-suur img { max-height: calc(100dvh - 9.5rem); }
    }
    .vaade-riba-aken {
      width: 100%;
      overflow: hidden;
      height: 4.6rem;
      margin: .45rem 0 .55rem;
    }
    .vaade-riba {
      display: flex;
      gap: .4rem;
      width: max-content;
      padding: 0 .5rem;
      animation: riba 48s linear infinite;
    }
    .vaade-riba:hover { animation-play-state: paused; }
    .vaade-riba img {
      height: 4.2rem;
      width: auto;
      border-radius: 5px;
      opacity: .45;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .vaade-riba img.aktiivne {
      opacity: 1;
      border-color: #f472d0;
    }
    @keyframes riba {
      0% { transform: translateX(0); }
      50% { transform: translateX(-35%); }
      100% { transform: translateX(0); }
    }
    .contact p { margin: .35rem 0; color: var(--muted); }
    footer.jalus {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 25;
      background: var(--dark);
      color: #fdeef8;
      padding: .06rem .6rem calc(.06rem + env(safe-area-inset-bottom, 0px));
      line-height: 1.15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    footer.jalus button {
      display: block;
      width: auto;
      background: none;
      border: 0;
      color: inherit;
      font: inherit;
      font-size: .78rem;
      letter-spacing: .03em;
      padding: 0;
      margin: 0;
      cursor: pointer;
    }
    .jalus-kontakt {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: .55rem;
    }
    footer.jalus a {
      color: inherit;
      text-decoration: none;
      font-size: .62rem;
      letter-spacing: .01em;
      opacity: .8;
      padding: 0;
    }
    footer.jalus a:hover,
    footer.jalus button:hover { color: #f472d0; }
    footer.jalus a[hidden] { display: none; }
    body { padding-bottom: 3.4rem; }
    .broneeri {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(18,14,12,.88);
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }
    .broneeri.sees { display: flex; }
    .broneeri-sulge {
      position: absolute;
      top: .7rem;
      right: .9rem;
      background: none;
      border: 0;
      color: #fdeef8;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
    }
    .broneeri form {
      background: var(--paper);
      color: var(--ink);
      width: min(28rem, 100%);
      max-height: min(36rem, calc(100vh - 2.4rem));
      overflow: auto;
      border-radius: 14px;
      padding: 1.25rem 1.15rem 1.35rem;
      border: 1px solid var(--line);
    }
    .broneeri h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.7rem;
      font-weight: 500;
      margin: 0 0 1rem;
    }
    .broneeri label {
      display: block;
      font-size: .82rem;
      color: var(--muted);
      margin: .55rem 0 .85rem;
    }
    .broneeri select,
    .broneeri input {
      display: block;
      width: 100%;
      margin-top: .28rem;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
      padding: .55rem .65rem;
      border-radius: 8px;
    }
    .broneeri input:focus {
      outline: 2px solid #f472d0;
      outline-offset: 1px;
    }
    .broneeri button[type="submit"] {
      width: 100%;
      margin-top: .4rem;
      border: 0;
      border-radius: 10px;
      background: var(--dark);
      color: #fdeef8;
      font: inherit;
      font-size: 1.02rem;
      padding: .75rem 1rem;
      cursor: pointer;
    }
    .broneeri button[type="submit"]:disabled {
      opacity: .35;
      cursor: default;
    }
    .broneeri-olek {
      margin: .7rem 0 0;
      font-size: .9rem;
      color: var(--muted);
    }
    .broneeri-varav {
      background: var(--paper);
      color: var(--ink);
      width: min(22rem, 100%);
      border-radius: 14px;
      padding: 1.25rem 1.15rem 1.35rem;
      border: 1px solid var(--line);
    }
    .broneeri-varav.peidus,
    .broneeri form.peidus { display: none; }
    .broneeri-varav h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.55rem;
      font-weight: 500;
      margin: 0 0 .85rem;
    }
    .broneeri-linnuke {
      display: flex;
      align-items: center;
      gap: .65rem;
      font-size: 1rem;
      color: var(--ink);
      cursor: pointer;
    }
    .broneeri-linnuke input {
      width: 1.15rem;
      height: 1.15rem;
      margin: 0;
      accent-color: var(--dark);
      cursor: pointer;
    }

    .pakk {
      padding: .75rem 0;
      border-top: 1px solid var(--line);
    }
    .pakk:first-child { border-top: 0; padding-top: 0; }
    .pakk h3 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.2rem;
      font-weight: 500;
      margin: 0 0 .25rem;
    }
    .pakk p { margin: .2rem 0; }
    .pakk .hind { color: var(--accent); }
    .empty { color: var(--muted); }

    .raamat {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(18,14,12,.88);
      align-items: center;
      justify-content: center;
    }
    .raamat.sees { display: flex; }
    .raamat-sulge {
      position: absolute;
      top: .7rem;
      right: .9rem;
      background: none;
      border: 0;
      color: #fdeef8;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      opacity: .75;
      z-index: 2;
    }
    .raamat-nool {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 2.7rem;
      height: 2.7rem;
      border: 2px solid #2a0a28;
      border-radius: 50%;
      background: #fdeef8;
      color: #2a0a28;
      font-size: 1.55rem;
      line-height: 1;
      cursor: pointer;
      z-index: 4;
      opacity: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .raamat-nool:disabled { opacity: .28; cursor: default; }
    .raamat-nool.vasak { left: .45rem; top: auto; bottom: .45rem; transform: none; }
    .raamat-nool.parem { right: .45rem; top: auto; bottom: .45rem; transform: none; }
    .raamat-vihje {
      position: absolute;
      left: 1.2rem;
      right: 1.2rem;
      bottom: .42rem;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      color: #7a4e72;
      font-size: 1.55rem;
      line-height: 1;
      letter-spacing: -.06em;
    }
    .raamat-vihje .pool { display: flex; gap: .08rem; }
    .raamat-vihje .kasv {
      display: inline-block;
      animation: vihjeKasv 1.5s ease-in-out infinite;
      text-shadow: 0 0 8px rgba(226,195,154,.9), 0 0 16px rgba(226,195,154,.45);
    }
    .raamat-vihje .pool.vasak .kasv:nth-child(1) { animation-delay: .36s; }
    .raamat-vihje .pool.vasak .kasv:nth-child(2) { animation-delay: .18s; }
    .raamat-vihje .pool.vasak .kasv:nth-child(3) { animation-delay: 0s; }
    .raamat-vihje .pool.parem .kasv:nth-child(1) { animation-delay: 0s; }
    .raamat-vihje .pool.parem .kasv:nth-child(2) { animation-delay: .18s; }
    .raamat-vihje .pool.parem .kasv:nth-child(3) { animation-delay: .36s; }
    .raamat-vihje.algus .pool.vasak { opacity: .22; }
    .raamat-vihje.otsas .pool.parem { opacity: .22; }
    @keyframes vihjeKasv {
      0%, 100% { opacity: .35; transform: scale(.88); }
      50% { opacity: 1; transform: scale(1.22); }
    }
    .raamat-vihje {
      pointer-events: none;
    }
    .raamat-sona {
      pointer-events: auto;
      background: none;
      border: 0;
      padding: .15rem .35rem;
      cursor: pointer;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: .04em;
      color: #2a0a28;
      text-shadow: 0 0 8px rgba(226,195,154,.9), 0 0 16px rgba(226,195,154,.45);
    }
    .raamat-sona:disabled {
      opacity: .22;
      cursor: default;
      text-shadow: none;
    }
    .raamat-paber p { font-size: 1rem; }

    .raamat-lava {
      width: min(38rem, 86vw);
      height: min(72vh, 40rem);
      perspective: 1800px;
      position: relative;
    }
    .raamat-paber {
      position: absolute;
      inset: 0;
      background: #fbe4f3;
      color: #2a0a28;
      padding: 1.35rem 1.55rem 2.2rem;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      overflow: hidden;
      box-sizing: border-box;
      transform-origin: center;
      backface-visibility: hidden;
    }
    .raamat-paber.peal { z-index: 2; }
    .raamat-paber.all { z-index: 1; }
    .raamat-paber.edasi {
      transform-origin: left center;
      animation: lehtEdasi 1.05s cubic-bezier(.37,.02,.18,1) .12s forwards;
    }
    .raamat-paber.tagasi {
      transform-origin: right center;
      animation: lehtTagasi 1.05s cubic-bezier(.37,.02,.18,1) .12s forwards;
    }
    @keyframes lehtEdasi {
      0% { transform: rotateY(0); box-shadow: 0 18px 50px rgba(0,0,0,.35); }
      40% { box-shadow: 18px 22px 40px rgba(0,0,0,.28); }
      100% { transform: rotateY(-180deg); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    }
    @keyframes lehtTagasi {
      0% { transform: rotateY(0); box-shadow: 0 18px 50px rgba(0,0,0,.35); }
      40% { box-shadow: -18px 22px 40px rgba(0,0,0,.28); }
      100% { transform: rotateY(180deg); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    }
    .raamat-paber p {
      margin: 0 0 .55rem;
      font-size: 1rem;
      line-height: 1.38;
    }
    .raamat-paber p:last-child { margin-bottom: 0; }
    @media (max-width: 820px) {
      .raamat-nool {
        width: 2.85rem;
        height: 2.85rem;
        font-size: 1.7rem;
        background: #fff7fb;
        border-width: 2px;
      }
      .raamat-nool.vasak { left: .28rem; bottom: .32rem; }
      .raamat-nool.parem { right: .28rem; bottom: .32rem; }
      .raamat-vihje { left: 1.1rem; right: 1.1rem; bottom: .38rem; }
      .raamat-sona { font-size: 1.7rem; }
      .raamat-lava {
        width: min(92vw, 38rem);
        height: min(74vh, 40rem);
      }
      .raamat-paber { padding: 1.05rem 1.15rem 2.35rem; }
      .raamat-paber p { font-size: .98rem; line-height: 1.3; margin-bottom: .38rem; }
    }
    a { color: var(--ink); }
  </style>
</head>
<body>
  <div class="riba">
    <div class="hero-top">
      <a class="logo" href="./" id="logo" aria-label="Õhupallid avaleht">
        <img src="parmu.jpg" alt="Õhupallid">

      <nav class="toc" id="peamenüü">
        <!-- teenused joonistab JS -->
      </nav>
      <div class="hero-right">
        <div class="social">
          <a class="fb" href="#" id="link-fb" aria-label="Facebook" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3c-2.8 0-5 2.2-5 5v3H6v4h3v8h4v-8h3l1-4h-4V9c0-.6.4-1 1-1z"/></svg>
          </a>
          <a class="ig" href="#" id="link-ig" aria-label="Instagram" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4zm10 2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-5 3.2A3.8 3.8 0 1 1 8.2 12 3.8 3.8 0 0 1 12 8.2zm0 1.6A2.2 2.2 0 1 0 14.2 12 2.2 2.2 0 0 0 12 9.8zM17.2 6.6a.9.9 0 1 1-.9.9.9.9 0 0 1 .9-.9z"/></svg>
          </a>
        </div>
        <div class="langs">
          <button type="button" data-lang="et" class="on">ET</button>
          <button type="button" data-lang="ru">RU</button>
          <button type="button" data-lang="tr">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </div>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow" data-i="eyebrow">õhupalliloomad · näomaalingud · glitter · kingitused</p>
      <div class="hero-nimi">
        <h1>Õhupallid</h1>
        <p class="lead" data-i="lead">Peole loom, näokuju, säde või kink.</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="teenused"></div>


    <h2 id="kontakt" data-i="kontakt">Kontakt</h2>
    <div class="contact">
      <p data-i="kontakt_kes">Õhupallid</p>
      <p data-i="telefon">Telefon: lisa number</p>
      <p data-i="kontakt_kord"></p>
    </div>
  </main>

  <div class="vaade" id="vaade">
    <button type="button" class="vaade-sulge" id="vaadeSulge" aria-label="Sulge"><span aria-hidden="true">×</span><span class="sona">Sulge</span></button>
    <div class="vaade-suur"><img id="vaadePilt" alt=""></div>
    <div class="vaade-riba-aken"><div class="vaade-riba" id="vaadeRiba"></div></div>
  </div>


  <div class="raamat" id="raamat" aria-hidden="true">
    <button type="button" class="raamat-sulge" id="raamatSulge" aria-label="Sulge">×</button>

    <div class="raamat-lava" id="raamatLava">
      <div class="raamat-paber all" id="raamatAll"></div>
      <div class="raamat-paber peal" id="raamatPeal"></div>
      <div class="raamat-vihje" id="raamatVihje">
        <button type="button" class="raamat-sona vasak" id="raamatVasak" data-i="raamat_tagasi">Tagasi</button>
        <button type="button" class="raamat-sona parem" id="raamatParem" data-i="raamat_edasi">Edasi</button>

  </div>

    <footer class="jalus">

      <a class="jalus-link" id="jalusTel" hidden></a>
      <a class="jalus-link" id="jalusPost" hidden></a>

  <div class="broneeri" id="broneeri">
    <button type="button" class="broneeri-sulge" id="broneeriSulge" aria-label="Sulge">×</button>
    <div class="broneeri-varav" id="broneeriVarav">
      <h2 data-i="broneeri_varav">Enne broneeringut</h2>
      <label class="broneeri-linnuke">
        <input type="checkbox" id="br_inimene">
        <span data-i="broneeri_inimene">Olen inimene</span>
      </label>
    </div>
    <form id="broneeriVorm" class="peidus" novalidate>
      <h2 data-i="broneeri_pealkiri">Broneering</h2>
      <label><span data-i="broneeri_toode">Toode</span>
        <select name="toode" id="br_toode" required></select>
      </label>
      <label><span data-i="broneeri_lapsed">Laste arv</span>
        <input name="lapsed" id="br_lapsed" inputmode="numeric" required>
      </label>
      <label><span data-i="broneeri_koht">Koht</span>
        <input name="koht" id="br_koht" required>
      </label>
      <label><span data-i="broneeri_kuupaev">Soovitud kuupäev</span>
        <input name="kuupaev" id="br_kuupaev" required>
      </label>
      <label><span data-i="broneeri_kella">Kellaaeg</span>
        <input name="kellaaeg" id="br_kella" required>
      </label>
      <label><span data-i="broneeri_epost">E-post</span>
        <input name="epost" id="br_epost" type="email" autocomplete="email" required>
      </label>
      <label><span data-i="broneeri_tel">Telefon</span>
        <input name="telefon" id="br_tel" type="tel" autocomplete="tel" required>
      </label>
      <button type="submit" id="broneeriSaada" data-i="broneeri_saada" disabled>Saada</button>
      <p class="broneeri-olek" id="broneeriOlek" hidden></p>
    </form>
  </div>

  <script>
    let T = {};
    let lang = localStorage.getItem("keel") || "et";
    let galeriidCache = [];
    let paketidCache = { teenused: [], paketid: [], pealkiri: {} };
    let seaded = { telefon: "", email: "", facebook: "", instagram: "" };
    let sisu = { et: {}, en: {} };

    function apply() {
      const pack = Object.assign({}, T[lang] || T.et, sisu[lang] || sisu.et || {});
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i]").forEach(el => {
        const k = el.getAttribute("data-i");
        if (pack[k]) el.textContent = pack[k];
      });
      document.querySelectorAll(".langs button").forEach(b => {
        b.classList.toggle("on", b.dataset.lang === lang);
      });
      const telEl = document.querySelector("[data-i='telefon']");
      if (telEl) {
        const nr = (seaded.telefon || "").trim();
        telEl.textContent = pack.telefon + (nr ? ": " + nr : "");
        if (nr) {
          telEl.innerHTML = pack.telefon + ": <a href='tel:" + nr.replace(/\s/g, "") + "'>" + nr + "</a>";
        }
      }
      const fb = document.getElementById("link-fb");
      const ig = document.getElementById("link-ig");
      if (fb) fb.href = seaded.facebook || "#";
      if (ig) ig.href = seaded.instagram || "#";
      seaJalus();

    }
    function seaJalus() {
      const tel = (seaded.telefon || "").trim();
      const post = (seaded.email || "").trim();
      const aTel = document.getElementById("jalusTel");
      const aPost = document.getElementById("jalusPost");
      if (aTel) {
        if (tel) {
          aTel.hidden = false;
          aTel.href = "tel:" + tel.replace(/\s/g, "");
          aTel.textContent = tel;
        } else {
          aTel.hidden = true;
          aTel.removeAttribute("href");
        }
      }
      if (aPost) {
        if (post) {
          aPost.hidden = false;
          aPost.href = "mailto:" + post;
          aPost.textContent = post;
        } else {
          aPost.hidden = true;
          aPost.removeAttribute("href");
        }
      }
    }
    document.querySelectorAll(".langs button").forEach(b => {
      b.addEventListener("click", () => {
        lang = b.dataset.lang;
        localStorage.setItem("keel", lang);
        apply();
        ehitaTeenused(galeriidCache);
        if (window.seaBroneeriVihjed) window.seaBroneeriVihjed();
        if (document.getElementById("raamat")?.classList.contains("sees") && window.avaRaamat) window.avaRaamat();
      });
    });

    function kuiKeriLopp(cb) {
      let t;
      const valmis = () => {
        window.removeEventListener("scroll", onScroll);
        cb();
      };
      const onScroll = () => {
        clearTimeout(t);
        t = setTimeout(valmis, 140);
      };
      window.addEventListener("scroll", onScroll, { passive: true });
      t = setTimeout(valmis, 900);
    }

    const FLIP_MS = 400;
    let flipBusy = false;

    function sulgeTeised(id) {
      return new Promise(resolve => {
        const teised = [...document.querySelectorAll("details.acc")].filter(
          d => d.id !== id && (d.open || d.classList.contains("avatud"))
        );
        if (!teised.length) {
          resolve();
          return;
        }
        teised.forEach(d => d.classList.remove("avatud"));
        setTimeout(() => {
          teised.forEach(d => { d.open = false; });
          resolve();
        }, 200);
      });
    }

    function taastaJrK() {
      const lava = document.getElementById("teenused");
      if (!lava) return;
      [...lava.querySelectorAll("details.acc")]
        .sort((a, b) => (+a.dataset.jrk || 0) - (+b.dataset.jrk || 0))
        .forEach(d => lava.appendChild(d));
    }

    function flipVali(id) {
      const lava = document.getElementById("teenused");
      const uus = document.getElementById(id);
      if (!lava || !uus || uus.tagName !== "DETAILS") return false;
      if (flipBusy) return true;
      if (uus.classList.contains("avatud") && lava.firstElementChild === uus) return true;
      flipBusy = true;
      const kaardid = [...lava.querySelectorAll("details.acc")];
      const firsts = {};
      kaardid.forEach(k => { firsts[k.id] = k.getBoundingClientRect(); });

      kaardid.forEach(k => {
        if (k !== uus) {
          k.classList.remove("avatud");
          k.open = false;
        }
      });
      uus.open = true;
      uus.classList.add("avatud");
      lava.insertBefore(uus, lava.firstChild);
      lava.classList.add("flipib");

      requestAnimationFrame(() => {
        kaardid.forEach(k => {
          const f = firsts[k.id];
          if (!f) return;
          const l = k.getBoundingClientRect();
          const dx = f.left - l.left;
          const dy = f.top - l.top;
          const sx = f.width / (l.width || 1);
          const sy = f.height / (l.height || 1);
          if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(sx - 1) < 0.01 && Math.abs(sy - 1) < 0.01) return;
          k.style.transition = "none";
          k.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + sx + "," + sy + ")";
          k.style.transformOrigin = "top left";
          k.style.zIndex = (k === uus) ? "8" : "1";
        });
        lava.offsetHeight;
        requestAnimationFrame(() => {
          kaardid.forEach(k => {
            const ease = (k === uus)
              ? "cubic-bezier(.22, 1, .36, 1)"
              : "cubic-bezier(.4, 0, .2, 1)";
            k.style.transition = "transform " + FLIP_MS + "ms " + ease;
            k.style.transform = "";
          });
        });
        setTimeout(() => {
          kaardid.forEach(k => {
            k.style.transition = "";
            k.style.transform = "";
            k.style.zIndex = "";
          });
          lava.classList.remove("flipib");
          flipBusy = false;
          const riba = document.querySelector(".riba");
          const vari = (riba ? riba.getBoundingClientRect().height : 64) + 8;
          const y = uus.getBoundingClientRect().top + window.scrollY - vari;
          window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
        }, FLIP_MS + 30);
      });
      return true;
    }

    function keriPaiste(el) {
      const riba = document.querySelector(".riba");
      const vari = (riba ? riba.getBoundingClientRect().height : 64) + 10;
      const y = el.getBoundingClientRect().top + window.scrollY - vari;
      window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
    }

    function jalusPadi(on) {
      const w = document.querySelector(".wrap");
      if (!w) return;
      if (window.matchMedia("(max-width: 820px)").matches) {
        w.style.paddingBottom = on ? "2rem" : "";
      } else {
        w.style.paddingBottom = "";
      }
    }

    function keriJalusNaha() {
      const foot = document.querySelector("footer");
      if (!foot) return;
      const y = foot.getBoundingClientRect().bottom + window.scrollY - window.innerHeight + 6;
      window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
    }

    function avaKoht(id) {
      const el = document.getElementById(id);
      if (!el) return;
      jalusPadi(id === "kontakt");
      if (id === "kontakt") {
        sulgeTeised("").then(() => keriJalusNaha());
        return;
      }
      if (flipVali(id)) return;
      sulgeTeised(id).then(() => {
        if (el.tagName === "DETAILS") {
          el.open = true;
          el.classList.add("avatud");
        }
        keriPaiste(el);
      });
    }

    document.querySelectorAll("details.acc > summary").forEach(s => {
      s.addEventListener("click", (e) => {
        e.preventDefault();
        const d = s.parentElement;
        if (d.open || d.classList.contains("avatud")) return;
        avaKoht(d.id);
      });
    });

    document.getElementById("logo").addEventListener("click", (e) => {
      e.preventDefault();
      history.replaceState(null, "", "./");
      jalusPadi(false);
      sulgeTeised("").then(() => {
        taastaJrK();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    const riba = document.querySelector(".riba");
    const menuNupp = document.getElementById("menuNupp");
    if (menuNupp && riba) {
      menuNupp.addEventListener("click", () => riba.classList.toggle("lahti"));
    }
    document.querySelectorAll("nav.toc a").forEach(a => {
      a.addEventListener("click", (e) => {
        const id = (a.getAttribute("href") || "").replace("#", "");
        if (!id) return;
        e.preventDefault();
        if (riba) riba.classList.remove("lahti");
        history.replaceState(null, "", "#" + id);
        avaKoht(id);
      });
    });

    if (location.hash) {
      avaKoht(location.hash.replace("#", ""));
    }


    function panePaketid(body, teenusId, pack) {
      const lubatud = paketidCache.teenused || [];
      const list = paketidCache.paketid || [];
      if (!list.length) return;
      if (lubatud.length && !lubatud.includes(teenusId)) return;
      const inn = document.createElement("details");
      inn.className = "inner";
      const isum = document.createElement("summary");
      isum.textContent = galVali(paketidCache.pealkiri) || pack.peopaketid || "Peopaketid";
      const ib = document.createElement("div");
      ib.className = "body";
      list.forEach(pk => {
        const art = document.createElement("article");
        art.className = "pakk";
        const h = document.createElement("h3");
        h.textContent = galVali(pk.nimi);
        art.appendChild(h);
        const kirj = galVali(pk.kirjeldus);
        if (kirj) {
          const p = document.createElement("p");
          p.textContent = kirj;
          art.appendChild(p);
        }
        const sisu = galVali(pk.sisu);
        if (sisu) {
          const p = document.createElement("p");
          p.style.whiteSpace = "pre-line";
          p.textContent = sisu;
          art.appendChild(p);
        }
        const hind = galVali(pk.hind);
        if (hind) {
          const p = document.createElement("p");
          p.className = "hind";
          p.textContent = hind;
          art.appendChild(p);
        }
        ib.appendChild(art);
      });
      inn.appendChild(isum);
      inn.appendChild(ib);
      body.appendChild(inn);
    }
    function galNimi(g) {
      const p = (g && g.pealkiri) || {};
      return p[lang] || p.et || g.id || "";
    }
    function galVali(obj) {
      if (!obj || typeof obj !== "object") return "";
      return obj[lang] || obj.et || "";
    }
    function seaNav() {
      const nav = document.getElementById("peamenüü");
      if (!nav) return;
      const pack = T[lang] || T.et || {};
      nav.innerHTML = "";
      galeriidCache.forEach(g => {
        const a = document.createElement("a");
        a.href = "#" + g.id;
        a.textContent = galNimi(g);
        nav.appendChild(a);
      });
      const k = document.createElement("a");
      k.href = "#kontakt";
      k.textContent = pack.nav_kontakt || pack.kontakt || "Kontakt";
      nav.appendChild(k);
      nav.querySelectorAll("a").forEach(a => {
        a.addEventListener("click", (e) => {
          const id = (a.getAttribute("href") || "").replace("#", "");
          if (!id) return;
          e.preventDefault();
          document.querySelector(".riba")?.classList.remove("lahti");
          history.replaceState(null, "", "#" + id);
          avaKoht(id);
        });
      });
    }
    function ehitaTeenused(andmed) {
      const hoidla = document.getElementById("teenused");
      if (!hoidla) return;
      let list = Array.isArray(andmed) ? andmed : [];
      if (list.length && typeof list[0] === "string") {
        list = [{ id: "pildid", pealkiri: { et: "Pildid" }, pildid: list }];
      }
      galeriidCache = list.map((g, i) => ({
        id: g.id || ("teenus-" + (i + 1)),
        pealkiri: g.pealkiri || {},
        jutt: g.jutt || {},
        pikk: g.pikk || {},
        pildid: (g.pildid || []).map(n => (typeof n === "string") ? n : (n.fail || "")).filter(Boolean)
      }));
      const pack = T[lang] || T.et || {};
      hoidla.innerHTML = "";
      galeriidCache.forEach((g, i) => {
        const d = document.createElement("details");
        d.className = "acc";
        d.id = g.id;
        d.dataset.jrk = String(i);
        const sum = document.createElement("summary");
        sum.textContent = galNimi(g);
        const clip = document.createElement("div");
        clip.className = "acc-clip";
        const body = document.createElement("div");
        body.className = "body";
        const jutt = galVali(g.jutt);
        if (jutt) {
          const p = document.createElement("p");
          p.textContent = jutt;
          body.appendChild(p);
        }
        const pikk = galVali(g.pikk);
        if (pikk) {
          const inn = document.createElement("details");
          inn.className = "inner";
          const isum = document.createElement("summary");
          isum.textContent = pack.pikemalt || "Pikemalt";
          const ib = document.createElement("div");
          ib.className = "body";
          ib.style.whiteSpace = "pre-line";
          ib.textContent = pikk;
          inn.appendChild(isum);
          inn.appendChild(ib);
          body.appendChild(inn);
        }
        if (g.pildid.length) {
          const btn = document.createElement("button");
          btn.className = "galerii-kaart";
          btn.type = "button";
          btn.dataset.gal = String(i);
          const img = document.createElement("img");
          img.src = "pildid/" + g.pildid[0];
          img.alt = "";
          btn.appendChild(img);
          body.appendChild(btn);
        }
        panePaketid(body, g.id, pack);
        clip.appendChild(body);
        d.appendChild(sum);
        d.appendChild(clip);
        hoidla.appendChild(d);
      });
      hoidla.querySelectorAll("details.acc > summary").forEach(s => {
        s.addEventListener("click", (e) => {
          e.preventDefault();
          const d = s.parentElement;
          if (d.open || d.classList.contains("avatud")) return;
          avaKoht(d.id);
        });
      });
      hoidla.onclick = (e) => {
        const nupp = e.target.closest("[data-gal]");
        if (!nupp) return;
        if (window.avaaGalerii) window.avaaGalerii(+nupp.dataset.gal, 0);
      };
      seaNav();
      if (!window.avaaGalerii) galeriiVaade();
      if (!window.avaRaamat) raamatToo();
    }

    function galeriiVaade() {
      const kast = document.getElementById("vaade");
      const suur = document.getElementById("vaadePilt");
      const riba = document.getElementById("vaadeRiba");
      if (!kast || !suur || !riba) return;
      let i = 0;
      let aktiivne = 0;
      let taimer = null;
      function kaaned() {
        const g = galeriidCache[aktiivne] || { pildid: [] };
        return (g.pildid || []).map(f => ({ src: "pildid/" + f }));
      }

      function seiska() {
        if (taimer) { clearInterval(taimer); taimer = null; }
      }
      function joonistaRiba(pildid) {
        riba.innerHTML = "";
        pildid.forEach((img, n) => {
          const th = document.createElement("img");
          th.src = img.src;
          th.alt = "";
          th.addEventListener("click", () => naita(n));
          riba.appendChild(th);
        });
      }
      function kaivita() {
        seiska();
        if (kaaned().length < 2) return;
        taimer = setInterval(() => naita(i + 1, false), 2200);
      }

      function naita(n, restart) {
        const pildid = kaaned();
        if (!pildid.length) return;
        i = (n + pildid.length) % pildid.length;
        suur.classList.remove("nahtav");
        setTimeout(() => {
          suur.src = pildid[i].src;
          suur.classList.add("nahtav");
        }, 200);
        riba.querySelectorAll("img").forEach((th, k) => th.classList.toggle("aktiivne", k === i));
        kast.classList.add("sees");
        document.body.style.overflow = "hidden";
        if (restart !== false) kaivita();
      }
      function sulge() {
        seiska();
        kast.classList.remove("sees");
        document.body.style.overflow = "";
      }

      document.getElementById("vaadeSulge").onclick = sulge;
      kast.onclick = (e) => { if (e.target === kast || e.target === suur) sulge(); };
      document.addEventListener("keydown", (e) => {
        if (!kast.classList.contains("sees")) return;
        if (e.key === "Escape") sulge();
        if (e.key === "ArrowRight") naita(i + 1);
        if (e.key === "ArrowLeft") naita(i - 1);
      });

      window.avaaGalerii = function (gal, n) {
        aktiivne = gal == null ? 0 : gal;
        joonistaRiba(kaaned());
        naita(n == null ? 0 : n);
      };
    }


    function raamatToo() {
      const kast = document.getElementById("raamat");
      const peal = document.getElementById("raamatPeal");
      const all = document.getElementById("raamatAll");
      const lava = document.getElementById("raamatLava");
      const nV = document.getElementById("raamatVasak");
      const nP = document.getElementById("raamatParem");
      if (!kast || !peal || !all || !lava) return;
      let lehed = [];
      let i = 0;
      let poore = false;
      let touchX = null;

      function loigud(tekst) {
        return String(tekst || "")
          .replace(/\r/g, "")
          .split(/\n+/)
          .map(s => s.trim())
          .filter(Boolean);
      }
      function laused(tekst) {
        return loigud(tekst);
      }
      function kirjuta(el, jupid) {
        el.innerHTML = "";
        const list = Array.isArray(jupid) ? jupid : [jupid];
        list.forEach(s => {
          const p = document.createElement("p");
          p.textContent = String(s || "").replace(/\s+/g, " ").trim();
          if (p.textContent) el.appendChild(p);
        });
      }
      function lehekuljesta(tekst) {
        const list = laused(tekst);
        const w = peal.clientWidth;
        const h = peal.clientHeight;
        if (!list.length || w < 40 || h < 40) return [tekst || ""];
        const mood = document.createElement("div");
        mood.className = "raamat-paber";
        mood.style.position = "absolute";
        mood.style.left = "-9999px";
        mood.style.top = "0";
        mood.style.width = w + "px";
        mood.style.height = h + "px";
        mood.style.visibility = "hidden";
        lava.appendChild(mood);
        const pages = [];
        let praegu = [];
        function proovi(jupid) {
          kirjuta(mood, jupid);
          return mood.scrollHeight - mood.clientHeight;
        }
        const varu = 6;
        list.forEach(lause => {
          const katse = praegu.concat([lause]);
          const yli = proovi(katse);
          if (yli <= varu) {
            praegu = katse;
            return;
          }
          if (praegu.length) {
            pages.push(praegu);
            praegu = [];
          }
          const yliYks = proovi([lause]);
          if (yliYks <= varu) {
            praegu = [lause];
            return;
          }
          const sonad = lause.split(/\s+/);
          let jupp = [];
          sonad.forEach(s => {
            const proov = jupp.concat([s]);
            if (proovi([proov.join(" ")]) <= varu || !jupp.length) {
              jupp = proov;
            } else {
              pages.push([jupp.join(" ")]);
              jupp = [s];
            }
          });
          if (jupp.length) praegu = [jupp.join(" ")];
        });
        if (praegu.length) pages.push(praegu);
        mood.remove();
        return pages.length ? pages : [list];
      }
      function naitaLeht(el, n) {
        const jupid = lehed[n] || [];
        if (Array.isArray(jupid)) kirjuta(el, jupid);
        else {
          el.innerHTML = "";
          const p = document.createElement("p");
          p.textContent = jupid;
          el.appendChild(p);
        }
      }
      function nooled() {
        nV.disabled = i <= 0;
        nP.disabled = i >= lehed.length - 1;
        const v = document.getElementById("raamatVihje");
        if (!v) return;
        v.classList.toggle("otsas", i >= lehed.length - 1);
        v.classList.toggle("algus", i <= 0);
      }
      function valmis() {
        naitaLeht(peal, i);
        nooled();
      }
      function keera(suund) {
        if (poore) return;
        const j = i + suund;
        if (j < 0 || j >= lehed.length) return;
        poore = true;
        naitaLeht(all, j);
        peal.classList.remove("edasi", "tagasi");
        void peal.offsetWidth;
        const klass = suund > 0 ? "edasi" : "tagasi";
        let valmisPoore = false;
        const lopeta = () => {
          if (valmisPoore) return;
          valmisPoore = true;
          peal.removeEventListener("animationend", lopeta);
          i = j;
          naitaLeht(peal, i);
          peal.classList.remove("edasi", "tagasi");
          peal.style.transform = "";
          poore = false;
          nooled();
        };
        peal.addEventListener("animationend", lopeta);
        setTimeout(() => peal.classList.add(klass), 80);
        setTimeout(lopeta, 1400);
      }
      function ava() {
        const tekst = (sisu[lang] && sisu[lang].mis_veel) || (sisu.et && sisu.et.mis_veel) || "";
        kast.classList.add("sees");
        kast.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        i = 0;
        peal.classList.remove("edasi", "tagasi");
        peal.style.transform = "";
        lehed = [laused(tekst)];
        valmis();
        setTimeout(() => {
          const leitud = lehekuljesta(tekst);
          lehed = leitud && leitud.length ? leitud : [laused(tekst)];
          if (i >= lehed.length) i = 0;
          valmis();
        }, 120);
      }
      function sulge() {
        kast.classList.remove("sees");
        kast.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        peal.classList.remove("edasi", "tagasi");
        poore = false;
      }
      nV.onclick = (e) => { e.stopPropagation(); keera(-1); };
      nP.onclick = (e) => { e.stopPropagation(); keera(1); };
      document.getElementById("raamatSulge").onclick = sulge;
      kast.addEventListener("click", (e) => { if (e.target === kast) sulge(); });
      lava.addEventListener("touchstart", (e) => {
        touchX = e.changedTouches[0].clientX;
      }, { passive: true });
      lava.addEventListener("touchend", (e) => {
        if (touchX == null) return;
        const dx = e.changedTouches[0].clientX - touchX;
        touchX = null;
        if (Math.abs(dx) < 40) return;
        keera(dx < 0 ? -1 : 1);
      }, { passive: true });
      document.addEventListener("keydown", (e) => {
        if (!kast.classList.contains("sees")) return;
        if (e.key === "Escape") sulge();
        if (e.key === "ArrowRight") keera(1);
        if (e.key === "ArrowLeft") keera(-1);
      });
      const sum = document.querySelector('[data-i="veel_pikemalt"]');
      if (sum) {
        sum.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const det = sum.closest("details");
          if (det) det.open = false;
          ava();
        });
      }
      window.avaRaamat = ava;
      window.sulgeRaamat = sulge;
    }

    Promise.all([
      fetch("tekstid.json", { cache: "no-store" }).then(r => r.json()),
      fetch("seaded.json", { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
      fetch("sisu.json", { cache: "no-store" }).then(r => r.json()).catch(() => ({ et: {}, en: {} })),
      fetch("pildid.json", { cache: "no-store" }).then(r => r.json()).catch(() => []),
      fetch("paketid.json", { cache: "no-store" }).then(r => r.json()).catch(() => ({ teenused: [], paketid: [] }))
    ]).then(([tekstid, s, sisuFail, pildid, pak]) => {
      T = tekstid;
      seaded = Object.assign(seaded, s);
      sisu = sisuFail;
      paketidCache = pak || { teenused: [], paketid: [], pealkiri: {} };
      apply();
      ehitaTeenused(pildid);
      broneeriToo();
      if (location.hash) avaKoht(location.hash.replace("#", ""));
    }).catch((err) => {
      console.error(err);
    });

    function broneeriToo() {
      const kate = document.getElementById("broneeri");
      const nupp = document.getElementById("broneeriNupp");
      const sulge = document.getElementById("broneeriSulge");
      const vorm = document.getElementById("broneeriVorm");
      const saada = document.getElementById("broneeriSaada");
      const olek = document.getElementById("broneeriOlek");
      if (!kate || !nupp || !vorm || !saada) return;
      if (window._broneeriValmis) return;
      window._broneeriValmis = true;

      const valjad = ["br_toode", "br_lapsed", "br_koht", "br_kuupaev", "br_kella", "br_epost", "br_tel"];
      function pack() { return Object.assign({}, T[lang] || T.et, sisu[lang] || sisu.et || {}); }
      function seaVihjed() {
        const p = pack();
        const map = {
          br_lapsed: p.broneeri_lapsed_vihje,
          br_kuupaev: p.broneeri_kuupaev_vihje,
          br_koht: p.broneeri_koht_vihje,
          br_kella: p.broneeri_kella_vihje,
          br_tel: p.broneeri_tel_vihje,
          br_epost: p.broneeri_epost_vihje
        };
        Object.entries(map).forEach(([id, txt]) => {
          const el = document.getElementById(id);
          if (el && txt) el.placeholder = txt;
        });
      }
      function tais() {
        const toode = (document.getElementById("br_toode").value || "").trim();
        const lapsed = (document.getElementById("br_lapsed").value || "").trim();
        const kuu = (document.getElementById("br_kuupaev").value || "").trim();
        const koht = (document.getElementById("br_koht").value || "").trim();
        const kell = (document.getElementById("br_kella").value || "").trim();
        const tel = (document.getElementById("br_tel").value || "").trim();
        const post = (document.getElementById("br_epost").value || "").trim();
        const n = parseInt(lapsed, 10);
        const ok = toode && n >= 1 && kuu && koht && kell && tel.length >= 6 && post.includes("@") && post.includes(".");
        saada.disabled = !ok;
        return ok;
      }
      const varav = document.getElementById("broneeriVarav");
      const inimene = document.getElementById("br_inimene");
      function naitaVarav() {
        if (varav) varav.classList.remove("peidus");
        vorm.classList.add("peidus");
        if (inimene) inimene.checked = false;
      }
      function seaTooted() {
        const sel = document.getElementById("br_toode");
        if (!sel) return;
        const praegu = sel.value;
        const p = pack();
        sel.innerHTML = "";
        const tyhi = document.createElement("option");
        tyhi.value = "";
        tyhi.textContent = p.broneeri_toode_vihje || "";
        sel.appendChild(tyhi);
        galeriidCache.forEach(g => {
          const o = document.createElement("option");
          o.value = g.id;
          o.textContent = galNimi(g);
          sel.appendChild(o);
        });
        if ([...sel.options].some(o => o.value === praegu)) sel.value = praegu;
      }
      function naitaVorm() {
        if (varav) varav.classList.add("peidus");
        vorm.classList.remove("peidus");
        seaVihjed();
        seaTooted();
        tais();
        document.getElementById("br_toode").focus();
      }
      function ava() {
        seaVihjed();
        olek.hidden = true;
        naitaVarav();
        kate.classList.add("sees");
        document.body.style.overflow = "hidden";
      }
      function paneKinni() {
        kate.classList.remove("sees");
        document.body.style.overflow = "";
        naitaVarav();
      }
      if (inimene) {
        inimene.addEventListener("change", () => {
          if (inimene.checked) naitaVorm();
        });
      }
      nupp.addEventListener("click", ava);
      sulge.addEventListener("click", paneKinni);
      kate.addEventListener("click", (e) => { if (e.target === kate) paneKinni(); });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && kate.classList.contains("sees")) paneKinni();
      });
      valjad.forEach(id => {
        document.getElementById(id).addEventListener("input", tais);
      });
      vorm.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!tais()) return;
        const p = pack();
        const toodeEl = document.getElementById("br_toode");
        const toodeNimi = toodeEl.options[toodeEl.selectedIndex] ? toodeEl.options[toodeEl.selectedIndex].text : "";
        const read = {
          toode: toodeNimi,
          lapsed: document.getElementById("br_lapsed").value.trim(),
          kuupaev: document.getElementById("br_kuupaev").value.trim(),
          koht: document.getElementById("br_koht").value.trim(),
          kellaaeg: document.getElementById("br_kella").value.trim(),
          telefon: document.getElementById("br_tel").value.trim(),
          epost: document.getElementById("br_epost").value.trim()
        };
        const keha = [
          p.broneeri_toode + ": " + read.toode,
          p.broneeri_lapsed + ": " + read.lapsed,
          p.broneeri_koht + ": " + read.koht,
          p.broneeri_kuupaev + ": " + read.kuupaev,
          p.broneeri_kella + ": " + read.kellaaeg,
          p.broneeri_epost + ": " + read.epost,
          p.broneeri_tel + ": " + read.telefon
        ].join("\n");
        const kuhu = (seaded.email || "").trim();
        if (kuhu) {
          const url = "mailto:" + encodeURIComponent(kuhu) +
            "?subject=" + encodeURIComponent(p.broneeri_teema || "Broneering") +
            "&body=" + encodeURIComponent(keha);
          window.location.href = url;
        }
        olek.hidden = false;
        olek.textContent = p.broneeri_valmis || "";
        vorm.reset();
        tais();
      });
      window.seaBroneeriVihjed = seaVihjed;
      seaVihjed();
    }
  </script>
